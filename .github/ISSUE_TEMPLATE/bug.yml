name: Bug report
description: Report reproducible incorrect behavior.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; follow SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include code, data shape, and deterministic steps.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: slop-ui, Vue, browser, Node, and package-manager versions.
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility impact
      description: Include keyboard, focus, screen-reader, zoom, or motion effects.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, SSR details, or relevant constraints. Remove secrets.
